<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Te amo Mina 🦝</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
      }

      body {
        display: flex;
        width: 100%;
        height: 100vh;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0a1628 0%, #1a0a2e 50%, #0d0d2b 100%);
        overflow: hidden;
      }

      .stars {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      .star {
        position: absolute;
        width: 2px; height: 2px;
        background: white;
        border-radius: 50%;
        animation: twinkle 3s ease-in-out infinite;
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      .container {
        position: relative;
        z-index: 1;
        width: 340px;
        text-align: center;
        padding: 35px 28px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(148, 163, 220, 0.15);
        border-radius: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 60px rgba(100, 50, 200, 0.15);
      }

      .lock-icon {
        font-size: 3.2rem;
        display: block;
        margin-bottom: 10px;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      .container h2 {
        font-size: 1.4rem;
        color: #e0c3fc;
        margin-bottom: 5px;
        font-weight: 300;
      }

      .input-display {
        margin: 18px 0;
        font-size: 34px;
        letter-spacing: 10px;
        color: #c4b5fd;
        font-weight: 300;
        text-shadow: 0 0 10px rgba(196, 181, 253, 0.3);
      }

      .keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 15px;
      }

      .keypad button {
        padding: 16px;
        font-size: 24px;
        background: linear-gradient(145deg, #1e1b4b, #312e81);
        color: #c7d2fe;
        border: 1px solid rgba(148, 163, 220, 0.25);
        border-radius: 14px;
        outline: none;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: 'Poppins', sans-serif;
        font-weight: 300;
      }

      .keypad button:hover {
        background: linear-gradient(145deg, #312e81, #4338ca);
        color: #fff;
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(148, 163, 220, 0.35);
      }

      .keypad button:active { transform: scale(0.95); }
      .keypad button:last-child { grid-column: 2/3; }

      .hint {
        margin-top: 18px;
        font-size: 12px;
        color: rgba(148, 163, 220, 0.4);
        letter-spacing: 1px;
      }

      .error-shake { animation: shake 0.4s ease; }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
      }
    </style>
  </head>
  <body>
    <div class="stars" id="stars"></div>
    <div class="container" id="container">
      <span class="lock-icon">🐢🔒🦝</span>
      <h2>Ingresa la contraseña</h2>
      <div class="input-display" id="inputDisplay">••••</div>
      <div class="keypad">
        <button onclick="enterDigit('1')">1</button>
        <button onclick="enterDigit('2')">2</button>
        <button onclick="enterDigit('3')">3</button>
        <button onclick="enterDigit('4')">4</button>
        <button onclick="enterDigit('5')">5</button>
        <button onclick="enterDigit('6')">6</button>
        <button onclick="enterDigit('7')">7</button>
        <button onclick="enterDigit('8')">8</button>
        <button onclick="enterDigit('9')">9</button>
        <button onclick="enterDigit('0')">0</button>
      </div>
      <div class="hint">13 · 07 · 2026</div>
    </div>

    <script>
      const correctPassword = "1307";
      const display = document.getElementById("inputDisplay");
      const container = document.getElementById("container");
      let input = "";

      const starsContainer = document.getElementById("stars");
      for (let i = 0; i < 80; i++) {
        const star = document.createElement("div");
        star.className = "star";
        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";
        star.style.animationDelay = Math.random() * 3 + "s";
        star.style.animationDuration = (2 + Math.random() * 2) + "s";
        star.style.width = star.style.height = (1 + Math.random() * 2) + "px";
        starsContainer.appendChild(star);
      }

      function enterDigit(digit) {
        if (input.length < 4) { input += digit; }
        display.textContent = input.padEnd(4, "•");
        if (input.length === 4) {
          if (input === correctPassword) {
            window.location.href = "flower.html";
          } else {
            display.textContent = "✕ ✕ ✕ ✕";
            display.style.color = "#f87171";
            container.classList.add("error-shake");
            setTimeout(() => container.classList.remove("error-shake"), 400);
            setTimeout(() => {
              input = "";
              display.textContent = "••••";
              display.style.color = "#c4b5fd";
            }, 800);
          }
        }
      }
    </script>
  </body>
</html>
